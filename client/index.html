<!DOCTYPE html>
<html>
<head>
  <title>Graph Explorer</title>
  <script src="https://unpkg.com/cytoscape/dist/cytoscape.min.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <div id="container">
   <div id="physics-panel">
      <h3>Physics</h3>

      <label>
        Repulsion
        <input id="repulsion" type="range" min="10" max="1000000" value="500000">
      </label>

      <label>
        Edge Length
        <input id="edgeLength" type="range" min="10" max="50000" value="5000">
      </label>

      <label>
        Gravity
        <input id="gravity" type="range" min="0" max="20" step="0.1" value="0.2">
      </label>
    </div>
    <div id="search-bar">
      <input id="search-input" type="text" placeholder="Search artist..." />
      <button id="search-btn">Go</button>
      <select id="search-type">
        <option value="artist">Artist</option>
        <option value="label">Label</option>
      </select>
    </div>
   <div id="cy"></div>

    <div id="side-panel">
      <h2 id="panel-title"></h2>
      <div id="panel-content"></div>
          <!-- hidden player -->
      <div id="yt-player"></div>
      <button id="close-panel">Close</button>
    </div>

    <script type="module" src="/src/app.js"></script>
</body>
